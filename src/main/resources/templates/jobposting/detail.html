<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Chi tiết việc làm')}"></head>
<body>
<header th:replace="~{layout/base :: header}"></header>
<main class="container page-content">
    <div class="page-heading heading-row">
        <div>
            <p class="eyebrow" th:text="${job.department}"></p>
            <h1><span th:text="${job.title}"></span> <span class="badge" th:text="${job.status}"></span></h1>
            <p><strong>Tổng số ứng viên: </strong> <span class="badge" th:text="${job.applicationCount}"></span></p>
        </div>

        <div class="actions">
            <a class="button" th:href="@{/jobs/{id}/applications(id=${job.id})}">Xem Ứng viên</a>
            <a class="button button-secondary" th:href="@{/jobs/{id}/report(id=${job.id})}">Xem Báo cáo</a>

            <hr style="margin: 0 10px; border-color: transparent;"> <a class="button button-secondary" th:if="${job.status.name() == 'DRAFT' or job.status.name() == 'ACTIVE'}" th:href="@{/jobs/{id}/edit(id=${job.id})}">Sửa</a>

            <form th:if="${job.status.name() == 'DRAFT'}" th:action="@{/jobs/{id}/publish(id=${job.id})}" method="post">
                <button class="button button-secondary" type="submit" onclick="return confirm('Bạn muốn đăng tin này?')">Đăng tin</button>
            </form>

            <form th:if="${job.status.name() == 'ACTIVE'}" th:action="@{/jobs/{id}/close(id=${job.id})}" method="post">
                <button class="button button-secondary" type="submit" onclick="return confirm('Đóng tin sẽ ngừng nhận đơn ứng tuyển mới. Tiếp tục?')">Đóng tin</button>
            </form>

            <form th:if="${job.status.name() == 'DRAFT' and job.applicationCount == 0}" th:action="@{/jobs/{id}/delete(id=${job.id})}" method="post" onsubmit="return confirm('Xóa tin này vĩnh viễn?')">
                <button class="button button-danger" type="submit">Xóa</button>
            </form>
        </div>
    </div>

    <div class="alert alert-warning" th:if="${job.status.name() == 'CLOSED'}">
        This posting is closed and no longer accepting applications.
    </div>

    <section class="detail-panel">
        <dl class="detail-grid">
            <div>
                <dt>Phòng ban</dt>
                <dd th:text="${job.department}"></dd>
            </div>
            <div>
                <dt>Địa điểm</dt>
                <dd th:text="${job.location ?: '-'}"></dd>
            </div>
            <div>
                <dt>Mức lương</dt>
                <dd th:text="${job.salaryRange ?: '-'}"></dd>
            </div>
            <div>
                <dt>Hạn nộp</dt>
                <dd th:text="${job.deadline ?: '-'}"></dd>
            </div>
            <div>
                <dt>Ngày tạo</dt>
                <dd th:text="${job.postedDate}"></dd>
            </div>
        </dl>

        <div style="margin-top: 20px;">
            <h3>Mô tả công việc</h3>
            <div style="white-space: pre-wrap;" th:text="${job.description}"></div>
        </div>

        <div style="margin-top: 20px;" th:if="${not #strings.isEmpty(job.requirements)}">
            <h3>Yêu cầu</h3>
            <div style="white-space: pre-wrap;" th:text="${job.requirements}"></div>
        </div>
    </section>
    <a class="text-link" th:href="@{/jobs}">&larr; Quay lại danh sách</a>
</main>
<footer th:replace="~{layout/base :: footer}"></footer>
</body>
</html>
