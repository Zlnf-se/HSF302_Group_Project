<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Quản lý Việc làm')}"></head>
<body>
<header th:replace="~{layout/base :: header}"></header>
<main class="container page-content">
    <div class="page-heading heading-row">
        <div>
            <p class="eyebrow">Job Management</p>
            <h1>Quản lý Tin tuyển dụng</h1>
            <p th:if="${hrView}">Danh sách các tin tuyển dụng bạn quản lý.</p>
            <p th:unless="${hrView}">Các vị trí đang tuyển.</p>
        </div>
        <a class="button" th:if="${hrView}" th:href="@{/jobs/new}">Tạo tin mới</a>
    </div>

    <!-- ===================== HR / Admin management view (SCR-10) ===================== -->
    <div th:if="${hrView}">
        <!-- Status filter tabs with counts -->
        <div class="stage-tabs">
            <a th:href="@{/jobs(keyword=${keyword}, department=${department})}"
               th:classappend="${#strings.isEmpty(status)} ? ' is-active'">
                Tất cả <span class="count" th:text="${totalCount}">0</span>
            </a>
            <a th:href="@{/jobs(status='DRAFT', keyword=${keyword}, department=${department})}"
               th:classappend="${status == 'DRAFT'} ? ' is-active'">
                Bản nháp <span class="count" th:text="${statusCounts.get('DRAFT')}">0</span>
            </a>
            <a th:href="@{/jobs(status='ACTIVE', keyword=${keyword}, department=${department})}"
               th:classappend="${status == 'ACTIVE'} ? ' is-active'">
                Đang mở <span class="count" th:text="${statusCounts.get('ACTIVE')}">0</span>
            </a>
            <a th:href="@{/jobs(status='CLOSED', keyword=${keyword}, department=${department})}"
               th:classappend="${status == 'CLOSED'} ? ' is-active'">
                Đã đóng <span class="count" th:text="${statusCounts.get('CLOSED')}">0</span>
            </a>
        </div>

        <!-- Search + department filter -->
        <form class="search-row" th:action="@{/jobs}" method="get">
            <input type="hidden" name="status" th:value="${status}">
            <input class="form-control" name="keyword" th:value="${keyword}" placeholder="Tìm theo tiêu đề...">
            <select class="form-control" name="department">
                <option value="">Tất cả phòng ban</option>
                <option th:each="d : ${departments}" th:value="${d}" th:text="${d}" th:selected="${d == department}"></option>
            </select>
            <button class="button" type="submit">Lọc</button>
        </form>

        <p class="muted" th:if="${#lists.isEmpty(jobs)}">Không có tin tuyển dụng nào khớp bộ lọc.</p>

        <div class="job-card-grid">
            <article class="job-card" th:each="job : ${jobs}">
                <div class="job-card-head">
                    <a class="job-card-title" th:href="@{/jobs/{id}(id=${job.id})}" th:text="${job.title}">Tiêu đề</a>
                    <span class="badge" th:text="${job.status}">ACTIVE</span>
                </div>
                <p class="muted">
                    <span th:text="${job.department ?: '-'}"></span> ·
                    <span th:text="${job.location ?: '-'}"></span>
                </p>
                <p class="muted">
                    Ứng viên: <strong th:text="${job.applicationCount}">0</strong>
                    <span th:if="${job.deadline != null}"> · Hạn nộp: <span th:text="${job.deadline}"></span></span>
                </p>
                <div class="actions job-card-actions">
                    <a class="button button-secondary button-small"
                       th:if="${job.status.name() == 'DRAFT' or job.status.name() == 'ACTIVE'}"
                       th:href="@{/jobs/{id}/edit(id=${job.id})}">Sửa</a>

                    <form th:if="${job.status.name() == 'DRAFT'}" th:action="@{/jobs/{id}/publish(id=${job.id})}" method="post">
                        <button class="button button-small" type="submit" onclick="return confirm('Bạn muốn đăng tin này?')">Đăng</button>
                    </form>

                    <form th:if="${job.status.name() == 'ACTIVE'}" th:action="@{/jobs/{id}/close(id=${job.id})}" method="post">
                        <button class="button button-secondary button-small" type="submit" onclick="return confirm('Bạn muốn đóng tin này?')">Đóng</button>
                    </form>

                    <form th:if="${job.status.name() == 'DRAFT' and job.applicationCount == 0}"
                          th:action="@{/jobs/{id}/delete(id=${job.id})}" method="post">
                        <button class="button button-danger button-small" type="submit" onclick="return confirm('Xóa tin nháp này?')">Xóa</button>
                    </form>
                </div>
            </article>
        </div>
    </div>

    <!-- ===================== Public listing (other roles) ===================== -->
    <div th:unless="${hrView}">
        <form class="search-row" th:action="@{/jobs}" method="get">
            <input class="form-control" name="keyword" th:value="${keyword}" placeholder="Tìm theo tiêu đề...">
            <button class="button" type="submit">Tìm kiếm</button>
        </form>
        <div class="job-card-grid">
            <article class="job-card" th:each="job : ${jobs}">
                <div class="job-card-head">
                    <a class="job-card-title" th:href="@{/jobs/{id}(id=${job.id})}" th:text="${job.title}">Tiêu đề</a>
                </div>
                <p class="muted">
                    <span th:text="${job.department ?: '-'}"></span> ·
                    <span th:text="${job.location ?: '-'}"></span>
                </p>
            </article>
        </div>
        <p class="muted" th:if="${#lists.isEmpty(jobs)}">Hiện chưa có vị trí nào đang mở.</p>
    </div>
</main>
<footer th:replace="~{layout/base :: footer}"></footer>
</body>
</html>
