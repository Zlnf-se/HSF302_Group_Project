<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Quản lý Việc làm')}"></head>
<body>
<header th:replace="~{layout/base :: header}"></header>
<main class="container page-content">
    <div class="page-heading heading-row">
        <div>
            <p class="eyebrow">Job Management</p>
            <h1>Quản lý Tin tuyển dụng</h1>
            <p>Danh sách các tin tuyển dụng của bạn.</p>
        </div>
        <a class="button" th:href="@{/jobs/new}">Tạo tin mới</a>
    </div>

    <form class="search-row" th:action="@{/jobs}" method="get">
        <input class="form-control" name="keyword" th:value="${keyword}" placeholder="Tìm theo tiêu đề...">
        <select class="form-control" name="status">
            <option value="">Tất cả trạng thái</option>
            <option value="DRAFT" th:selected="${status == 'DRAFT'}">Bản nháp (Draft)</option>
            <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">Đang mở (Active)</option>
            <option value="CLOSED" th:selected="${status == 'CLOSED'}">Đã đóng (Closed)</option>
        </select>
        <button class="button" type="submit">Tìm kiếm</button>
    </form>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>Tiêu đề</th>
                <th>Phòng ban</th>
                <th>Địa điểm</th>
                <th>Trạng thái</th>
                <th>Số ứng viên</th>
                <th>Hạn nộp</th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="job : ${jobs}">
                <td><strong th:text="${job.title}"></strong></td>
                <td th:text="${job.department}"></td>
                <td th:text="${job.location ?: '-'}"></td>
                <td><span class="badge" th:text="${job.status}"></span></td>
                <td th:text="${job.applicationCount}">0</td>
                <td th:text="${job.deadline ?: '-'}"></td>
                <td>
                    <div style="display: flex; gap: 5px;">
                        <a class="button button-secondary button-small" th:href="@{/jobs/{id}(id=${job.id})}">Xem</a>

                        <a class="button button-secondary button-small" th:if="${job.status.name() == 'DRAFT' or job.status.name() == 'ACTIVE'}" th:href="@{/jobs/{id}/edit(id=${job.id})}">Sửa</a>

                        <form th:if="${job.status.name() == 'DRAFT'}" th:action="@{/jobs/{id}/publish(id=${job.id})}" method="post">
                            <button class="button button-small" type="submit" onclick="return confirm('Bạn muốn đăng tin này?')">Đăng</button>
                        </form>

                        <form th:if="${job.status.name() == 'ACTIVE'}" th:action="@{/jobs/{id}/close(id=${job.id})}" method="post">
                            <button class="button button-secondary button-small" type="submit" onclick="return confirm('Bạn muốn đóng tin này?')">Đóng</button>
                        </form>

                        <form th:if="${job.status.name() == 'DRAFT' and job.applicationCount == 0}" th:action="@{/jobs/{id}/delete(id=${job.id})}" method="post">
                            <button class="button button-danger button-small" type="submit" onclick="return confirm('Xóa tin nháp này?')">Xóa</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(jobs)}">
                <td colspan="7" class="empty-cell">Không tìm thấy tin tuyển dụng nào.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{layout/base :: footer}"></footer>
</body>
</html>
