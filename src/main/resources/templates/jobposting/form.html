<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(${editMode ? 'Sửa tin tuyển dụng' : 'Tạo tin tuyển dụng'})}"></head>
<body>
<header th:replace="~{layout/base :: header}"></header>
<main class="container page-content">
    <div class="page-heading">
        <p class="eyebrow">Job Posting Form</p>
        <h1 th:text="${editMode ? 'Sửa tin tuyển dụng' : 'Tạo tin tuyển dụng mới'}"></h1>
    </div>

    <div class="alert alert-warning" th:if="${jobPostingForm.status == 'CLOSED'}">
        Tin tuyển dụng này đã đóng và không thể chỉnh sửa.
    </div>

    <form class="form-panel form-panel-wide" th:action="${editMode} ? @{/jobs/{id}/edit(id=${jobId})} : @{/jobs}" th:object="${jobPostingForm}" method="post">
        <div class="alert alert-error" th:if="${#fields.hasGlobalErrors()}">
            <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
        </div>

        <input type="hidden" th:field="*{id}">

        <fieldset th:disabled="${jobPostingForm.status == 'CLOSED'}">
            <div class="form-grid">

                <div class="form-group form-grid-full">
                    <label>Tiêu đề *</label>
                    <input class="form-control" th:field="*{title}" required>
                    <span class="field-error" th:errors="*{title}"></span>
                </div>

                <div class="form-group">
                    <label>Công ty *</label>
                    <select class="form-control" th:field="*{companyId}" required>
                        <option value="">-- Chọn công ty --</option>
                        <option th:each="c:${companies}" th:value="${c.id}" th:text="${c.name}"></option>
                    </select>
                    <span class="field-error" th:errors="*{companyId}"></span>
                </div>

                <div class="form-group">
                    <label>Phòng ban *</label>
                    <input class="form-control" th:field="*{department}" required>
                </div>

                <div class="form-group">
                    <label>Địa điểm *</label>
                    <input class="form-control" th:field="*{location}" required>
                </div>

                <div class="form-group">
                    <label>Loại việc *</label>
                    <select class="form-control" th:field="*{jobType}" required>
                        <option value="">-- Chọn loại --</option>
                        <option th:each="t:${jobTypes}" th:value="${t.name()}" th:text="${t.name()}"></option>
                    </select>
                    <span class="field-error" th:errors="*{jobType}"></span>
                </div>

                <div class="form-group">
                    <label>Hạn nộp</label>
                    <input class="form-control" type="date" th:field="*{deadline}">
                    <span class="field-error" th:errors="*{deadline}"></span>
                </div>

                <div class="form-group">
                    <label>Lương tối thiểu ($)</label>
                    <input class="form-control" type="number" step="0.01" min="0" th:field="*{salaryMin}">
                    <span class="field-error" th:errors="*{salaryMin}"></span>
                </div>

                <div class="form-group">
                    <label>Lương tối đa ($)</label>
                    <input class="form-control" type="number" step="0.01" min="0" th:field="*{salaryMax}">
                    <span class="field-error" th:errors="*{salaryMax}"></span>
                </div>

                <div class="form-group form-grid-full">
                    <label>Mô tả công việc *</label>
                    <textarea class="form-control" rows="6" th:field="*{description}" required></textarea>
                </div>

                <div class="form-group form-grid-full">
                    <label>Yêu cầu</label>
                    <textarea class="form-control" rows="4" th:field="*{requirements}"></textarea>
                </div>

                <fieldset class="form-group form-grid-full skill-picker">
                    <legend>Kỹ năng yêu cầu</legend>
                    <label th:each="s:${skills}">
                        <input type="checkbox" th:field="*{skillIds}" th:value="${s.id}">
                        <span th:text="${s.name}"></span>
                    </label>
                </fieldset>
            </div>

            <div class="actions" style="margin-top: 20px;">
                <button class="button button-secondary" type="submit" name="action" value="DRAFT" th:if="${not editMode or jobPostingForm.status == 'DRAFT'}">Lưu nháp</button>

                <button class="button" type="submit" name="action" value="PUBLISH" th:if="${editMode and jobPostingForm.status == 'DRAFT'}">Đăng tin (Publish)</button>

                <button class="button" type="submit" name="action" value="UPDATE" th:if="${editMode and jobPostingForm.status == 'ACTIVE'}">Lưu thay đổi</button>

                <a class="button button-secondary" th:href="@{${editMode} ? '/jobs/' + ${jobId} : '/jobs'}">Hủy</a>
            </div>
        </fieldset>
    </form>
</main>
<footer th:replace="~{layout/base :: footer}"></footer>
</body>
</html>
