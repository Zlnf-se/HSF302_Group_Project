<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Danh sách ứng tuyển')}"></head>
<body>
<header th:replace="~{layout/base :: header}"></header>
<main class="container page-content">
    <nav class="breadcrumb">
        <a class="text-link" th:href="@{/jobs/{id}(id=${job.id})}">&larr; Chi tiết việc làm</a>
    </nav>
    <div class="page-heading">
        <p class="eyebrow" th:text="${job.company != null ? job.company.name : ''}">Công ty</p>
        <h2>
            <span th:text="${job.title}">Vị trí</span>
            <span class="badge" th:text="${job.status}">OPEN</span>
        </h2>
        <p>Quản lý ứng viên theo từng giai đoạn tuyển dụng.</p>
    </div>

    <div class="stage-tabs">
        <a th:href="@{/jobs/{id}/applications(id=${job.id})}"
           th:classappend="${selectedStage == null} ? ' is-active'">
            Tất cả <span class="count" th:text="${totalCount}">0</span>
        </a>
        <a th:each="stage : ${stages}"
           th:href="@{/jobs/{id}/applications(id=${job.id}, stage=${stage})}"
           th:classappend="${selectedStage != null and selectedStage.name() == stage.name()} ? ' is-active'">
            <span th:text="${T(com.recruit.recruitmentapplication.util.PipelineStages).label(stage)}">Giai đoạn</span>
            <span class="count" th:text="${counts.get(stage)}">0</span>
        </a>
    </div>

    <div class="table-wrap" th:if="${!applications.isEmpty()}">
        <table>
            <thead>
            <tr>
                <th>Ứng viên</th>
                <th>Ngày nộp</th>
                <th>Số ngày ở giai đoạn</th>
                <th>Trạng thái</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="a : ${applications}">
                <td>
                    <strong th:text="${a.candidate.name}">Tên</strong><br>
                    <span class="muted" th:text="${a.candidate.email}">email</span>
                </td>
                <td th:text="${a.appliedAt != null ? #temporals.format(a.appliedAt, 'dd/MM/yyyy') : '-'}">-</td>
                <td th:text="${a.stageEnteredAt != null ? T(java.time.temporal.ChronoUnit).DAYS.between(a.stageEnteredAt, T(java.time.LocalDateTime).now()) + ' ngày' : '-'}">-</td>
                <td>
                    <span th:classappend="${T(com.recruit.recruitmentapplication.util.PipelineStages).badgeClass(a.status)}"
                          th:text="${T(com.recruit.recruitmentapplication.util.PipelineStages).label(a.status)}">Trạng thái</span>
                </td>
                <td>
                    <a class="button button-secondary button-small" th:href="@{/applications/{id}(id=${a.id})}">Mở</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <p class="muted" th:if="${applications.isEmpty()}">Chưa có ứng viên nào ở giai đoạn này.</p>
</main>
<footer th:replace="~{layout/base :: footer}"></footer>
</body>
</html>
