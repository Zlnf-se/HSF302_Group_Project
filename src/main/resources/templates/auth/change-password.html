<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Change Password')}"></head>
<body>
<header th:replace="~{layout/base :: header}"></header>
<main class="container page-content">
    <div class="page-heading">
        <p class="eyebrow">Account</p>
        <h1>Change Password</h1>
    </div>
    <form class="form-panel" th:action="@{/profile/password}" th:object="${changePasswordForm}" method="post">
        <div class="alert alert-error" th:if="${passwordError}" th:text="${passwordError}"></div>
        <div class="form-group">
            <label for="currentPassword">Current password</label>
            <input class="form-control" id="currentPassword" type="password" th:field="*{currentPassword}" required>
            <span class="field-error" th:errors="*{currentPassword}"></span>
        </div>
        <div class="form-group">
            <label for="newPassword">New password</label>
            <input class="form-control" id="newPassword" type="password" th:field="*{newPassword}" required>
            <p class="helper-text">At least 8 characters, including 1 uppercase letter and 1 number</p>
            <span class="field-error" th:errors="*{newPassword}"></span>
        </div>
        <div class="form-group">
            <label for="confirmNewPassword">Confirm new password</label>
            <input class="form-control" id="confirmNewPassword" type="password" th:field="*{confirmNewPassword}" required>
            <span class="field-error" th:errors="*{confirmNewPassword}"></span>
        </div>
        <div class="actions">
            <button class="button" type="submit">Change Password</button>
            <a class="button button-secondary" th:href="@{/profile}">Cancel</a>
        </div>
    </form>
</main>
<footer th:replace="~{layout/base :: footer}"></footer>
</body>
</html>
