<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Reset Password')}"></head>
<body>
<header th:replace="~{layout/base :: header}"></header>
<main class="container page-content">
    <div class="page-heading">
        <p class="eyebrow">Account</p>
        <h1>Reset your password</h1>
        <p>Enter your email address and we will send you a link to reset your password.</p>
    </div>
    <form class="form-panel" th:action="@{/password-reset}" th:object="${passwordResetRequestForm}" method="post">
        <div class="alert alert-success" th:if="${resetRequested}">
            If an account with this email exists, a reset link has been sent.
        </div>
        <div class="form-group">
            <label for="email">Email address</label>
            <input class="form-control" id="email" type="email" th:field="*{email}" required>
            <span class="field-error" th:errors="*{email}"></span>
        </div>
        <button class="button button-block" type="submit">Send Reset Link</button>
        <p class="form-footer-link"><a class="text-link" th:href="@{/auth/login}">Back to Sign In</a></p>
    </form>
</main>
<footer th:replace="~{layout/base :: footer}"></footer>
</body>
</html>
