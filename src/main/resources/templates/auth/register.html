<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Create Account')}"></head>
<body>
<header th:replace="~{layout/base :: header}"></header>
<main class="container page-content">
    <div class="page-heading">
        <p class="eyebrow">TalentHub</p>
        <h1>Create your account</h1>
        <p>Candidate accounts can apply for open positions and track application status.</p>
    </div>
    <form class="form-panel" th:action="@{/register}" th:object="${registerForm}" method="post" data-required-form>
        <div class="alert alert-error" th:if="${registrationError}" th:text="${registrationError}"></div>

        <div class="form-group">
            <label for="fullName">Full name</label>
            <input class="form-control" id="fullName" th:field="*{fullName}" required>
            <span class="field-error" th:errors="*{fullName}"></span>
        </div>
        <div class="form-group">
            <label for="username">Username</label>
            <input class="form-control" id="username" th:field="*{username}" autocomplete="username" required>
            <p class="helper-text">4-50 characters. Letters, digits, and underscores only.</p>
            <span class="field-error" th:errors="*{username}"></span>
        </div>
        <div class="form-group">
            <label for="email">Email address</label>
            <input class="form-control" id="email" type="email" th:field="*{email}" autocomplete="email" required>
            <span class="field-error" th:errors="*{email}"></span>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input class="form-control" id="password" type="password" th:field="*{password}" autocomplete="new-password" required>
            <p class="helper-text">At least 8 characters, including 1 uppercase letter and 1 number</p>
            <span class="field-error" th:errors="*{password}"></span>
        </div>
        <div class="form-group">
            <label for="confirmPassword">Confirm password</label>
            <input class="form-control" id="confirmPassword" type="password" th:field="*{confirmPassword}" autocomplete="new-password" required>
            <span class="field-error" th:errors="*{confirmPassword}"></span>
        </div>
        <button class="button button-block" type="submit" data-submit>Create Account</button>
        <p class="form-footer-link"><a class="text-link" th:href="@{/login}">Already have an account?</a></p>
    </form>
</main>
<footer th:replace="~{layout/base :: footer}"></footer>
<script>
document.querySelectorAll("[data-required-form]").forEach(function (form) {
    var button = form.querySelector("[data-submit]");
    var fields = Array.from(form.querySelectorAll("input[required]"));
    function sync() {
        button.disabled = fields.some(function (field) { return !field.value.trim(); });
    }
    fields.forEach(function (field) { field.addEventListener("input", sync); });
    sync();
});
</script>
</body>
</html>
