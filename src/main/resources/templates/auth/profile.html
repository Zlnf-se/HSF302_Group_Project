<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('User Profile')}"></head>
<body>
<header th:replace="~{layout/base :: header}"></header>
<main class="container page-content">
    <div class="page-heading">
        <p class="eyebrow">Account</p>
        <h1>User Profile</h1>
    </div>
    <div class="alert alert-success" th:if="${param.passwordChanged != null}">Password changed successfully.</div>
    <section class="detail-panel">
        <dl class="detail-grid">
            <div>
                <dt>Full name</dt>
                <dd th:text="${user.fullName}">User Name</dd>
            </div>
            <div>
                <dt>Username</dt>
                <dd><span th:text="${user.username}">username</span> <span class="muted">cannot be changed</span></dd>
            </div>
            <div>
                <dt>Email</dt>
                <dd th:text="${user.email}">user@example.com</dd>
            </div>
            <div>
                <dt>Role</dt>
                <dd><span class="badge" th:text="${user.role.name}">CANDIDATE</span></dd>
            </div>
        </dl>
    </section>
    <div class="actions">
        <a class="button button-secondary" th:href="@{/profile/password}">Change Password</a>
        <a class="button button-danger" th:href="@{/logout}">Sign Out</a>
    </div>
</main>
<footer th:replace="~{layout/base :: footer}"></footer>
</body>
</html>
