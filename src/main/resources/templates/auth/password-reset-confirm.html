<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Set New Password')}"></head>
<body>
<header th:replace="~{layout/base :: header}"></header>
<main class="container page-content">
    <div class="page-heading">
        <p class="eyebrow">Account</p>
        <h1>Set your new password</h1>
    </div>
    <form class="form-panel" th:action="@{/password-reset/confirm}" th:object="${passwordResetConfirmForm}" method="post">
        <div class="alert alert-error" th:if="${resetLinkError}">
            <span th:text="${resetLinkError}"></span>
            <a class="text-link" th:href="@{/password-reset}">Request a new reset link.</a>
        </div>
        <div class="alert alert-error" th:if="${resetError != null and resetLinkError == null}" th:text="${resetError}"></div>

        <div th:if="${resetLinkError == null}">
            <input type="hidden" th:field="*{token}">
            <div class="form-group">
                <label for="newPassword">New password</label>
                <input class="form-control" id="newPassword" type="password" th:field="*{newPassword}" required>
                <p class="helper-text">At least 8 characters, including 1 uppercase letter and 1 number</p>
                <span class="field-error" th:errors="*{newPassword}"></span>
            </div>
            <div class="form-group">
                <label for="confirmNewPassword">Confirm new password</label>
                <input class="form-control" id="confirmNewPassword" type="password" th:field="*{confirmNewPassword}" required>
                <span class="field-error" th:errors="*{confirmNewPassword}"></span>
            </div>
            <button class="button button-block" type="submit">Set Password</button>
        </div>
    </form>
</main>
<footer th:replace="~{layout/base :: footer}"></footer>
</body>
</html>
